services:
  postgres:
    image: postgres:16-alpine
    container_name: gtm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gtm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtm_password}
      POSTGRES_DB: ${POSTGRES_DB:-gtm_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gtm_user} -d ${POSTGRES_DB:-gtm_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gtm_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
